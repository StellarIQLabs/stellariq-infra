global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: [api.stellariq-prod.svc:80]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: http_request_duration_seconds|http_requests_total|process_resident_memory_bytes
        action: keep

  - job_name: routing-engine
    metrics_path: /metrics
    static_configs:
      - targets: [routing-engine.stellariq-prod.svc:80]

  - job_name: indexer
    metrics_path: /metrics
    static_configs:
      - targets: [indexer.stellariq-prod.svc:4101]

  - job_name: price-engine
    metrics_path: /metrics
    static_configs:
      - targets: [price-engine.stellariq-prod.svc:80]

  - job_name: postgres-exporter
    static_configs:
      - targets: [postgres-exporter.monitoring.svc:9187]

  - job_name: redis-exporter
    static_configs:
      - targets: [redis-exporter.monitoring.svc:9121]

rule_files:
  - /etc/prometheus/rules/*.yml
