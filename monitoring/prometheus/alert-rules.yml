groups:
  - name: stellariq-slo
    interval: 1m
    rules:
      - alert: ApiDown
        expr: up{job="api"} == 0
        for: 2m
        labels: { severity: critical, channel: pagerduty }
        annotations:
          summary: API down for more than 2 minutes
      - alert: IngestionFailure
        expr: increase(indexer_errors_total[15m]) > 10
        for: 5m
        labels: { severity: critical, channel: slack-ops }
        annotations:
          summary: Indexer error spike — ingestion may be failing
      - alert: PriceEngineStale
        expr: time() - price_engine_last_update_seconds > 300
        for: 5m
        labels: { severity: warning, channel: slack-ops }
        annotations:
          summary: Price engine has not published for 5 minutes
      - alert: BackupFailure
        expr: backup_last_success_seconds < (time() - 93600)
        for: 30m
        labels: { severity: critical, channel: pagerduty }
        annotations:
          summary: No successful backup in the last 26h
      - alert: QuoteLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(quote_duration_seconds_bucket[5m])) by (le)) > 1
        for: 10m
        labels: { severity: warning, channel: slack-ops }
        annotations:
          summary: Quote p95 above 1s SLO
