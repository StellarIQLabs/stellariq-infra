# Data consistency monitoring (PRD 1134)
# The reconciler job verifies indexed pools/swaps against chain state and exposes:
#   stellariq_consistency_gap{entity="pools"|"swaps"} 0 = consistent
#   stellariq_consistency_last_run_seconds (unix timestamp)
# Alert `TVLConsistencyGap` fires when the gap persists > 30m.
groups:
  - name: stellariq-consistency
    rules:
      - alert: TVLConsistencyGap
        expr: stellariq_consistency_gap > 0
        for: 30m
        labels: { severity: warning, channel: slack-ops }
        annotations:
          summary: Indexed pools/swaps diverge from chain for 30m
