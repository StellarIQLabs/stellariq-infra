apiVersion: batch/v1
kind: CronJob
metadata:
  name: secret-rotation
  namespace: stellariq-prod
spec:
  schedule: "0 3 1 * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: secret-rotator
          containers:
            - name: rotate
              image: amazon/aws-cli:2.17.0
              command: ["/bin/sh", "-c", "echo 'Trigger rotation Lambda/SSM automation monthly; see scripts/rotate-secrets.sh --env production --apply'"]
