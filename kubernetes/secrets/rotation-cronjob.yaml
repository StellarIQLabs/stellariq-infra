apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-rotator
  namespace: stellariq-prod
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/stellariq-production-secrets-rotation
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: secret-rotation
  namespace: stellariq-prod
spec:
  schedule: "0 3 1 * *"
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: secret-rotator
          restartPolicy: OnFailure
          containers:
            - name: rotate
              image: bitnami/kubectl:1.30
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  PREFIX="stellariq-production"
                  echo "[rotate] Starting monthly secret rotation for $PREFIX"

                  # --- Rotate DB password ---
                  NEW_PW=$(openssl rand -base64 24 | tr -d '/+=' | head -c 32)
                  aws secretsmanager put-secret-value \
                    --secret-id "$PREFIX/postgres" \
                    --secret-string "{\"username\":\"stellariq\",\"password\":\"$NEW_PW\",\"dbname\":\"stellariq\"}"
                  aws rds modify-db-instance \
                    --db-instance-identifier "$PREFIX-postgres" \
                    --master-user-password "$NEW_PW" \
                    --apply-immediately
                  echo "[rotate] DB password updated in Secrets Manager + RDS"

                  # --- Rotate JWT signing key ---
                  NEW_KEY=$(openssl rand -hex 32)
                  aws secretsmanager put-secret-value \
                    --secret-id "$PREFIX/api" \
                    --secret-string "{\"jwtSecret\":\"$NEW_KEY\"}"
                  echo "[rotate] JWT signing key updated in Secrets Manager"

                  # --- Rolling restart to pick up new secrets (dual-key overlap handled by API) ---
                  kubectl -n stellariq-prod rollout restart deploy/api deploy/routing-engine
                  kubectl -n stellariq-prod rollout status deploy/api --timeout=300s
                  echo "[rotate] Workloads restarted; old tokens honored for 15m via dual-key check"

                  # --- Force ExternalSecrets sync immediately ---
                  kubectl -n stellariq-prod annotate externalsecret --all \
                    force-sync="$(date +%s)" --overwrite
                  echo "[rotate] ExternalSecrets sync triggered"

                  echo "[rotate] Monthly rotation complete"
              env:
                - name: AWS_REGION
                  value: us-east-1
