# ExternalSecrets: postgres password, redis url, api keys injected as env. No secrets committed.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets
  namespace: stellariq-prod
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef: { name: external-secrets }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: stellariq-api-env
  namespace: stellariq-prod
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets, kind: SecretStore }
  target: { name: stellariq-api-env, creationPolicy: Owner }
  data:
    - { secretKey: DATABASE_URL, remoteRef: { key: stellariq-prod/postgres, property: connectionString } }
    - { secretKey: REDIS_URL, remoteRef: { key: stellariq-prod/redis, property: url } }
    - { secretKey: JWT_SECRET, remoteRef: { key: stellariq-prod/api, property: jwtSecret } }
    - { secretKey: SOROBAN_RPC_URL, remoteRef: { key: stellariq-prod/api, property: sorobanRpc } }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: stellariq-engines-env
  namespace: stellariq-prod
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets, kind: SecretStore }
  target: { name: stellariq-engines-env, creationPolicy: Owner }
  data:
    - { secretKey: DATABASE_URL, remoteRef: { key: stellariq-prod/postgres, property: connectionString } }
    - { secretKey: REDIS_URL, remoteRef: { key: stellariq-prod/redis, property: url } }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: stellariq-indexer-env
  namespace: stellariq-prod
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets, kind: SecretStore }
  target: { name: stellariq-indexer-env, creationPolicy: Owner }
  data:
    - { secretKey: DATABASE_URL, remoteRef: { key: stellariq-prod/postgres, property: connectionString } }
    - { secretKey: REDIS_URL, remoteRef: { key: stellariq-prod/redis, property: url } }
