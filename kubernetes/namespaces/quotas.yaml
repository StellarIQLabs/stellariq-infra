apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: stellariq-staging
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "50"
    services: "20"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: stellariq-prod
spec:
  hard:
    requests.cpu: "32"
    requests.memory: 64Gi
    limits.cpu: "64"
    limits.memory: 128Gi
    pods: "200"
    services: "40"
