apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: stellariq-prod
  labels: { app: api }
spec:
  replicas: 3
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: api
          image: REGISTRY/stellariq-prod/api:TAG
          ports: [{ containerPort: 4000 }]
          envFrom:
            - secretRef: { name: stellariq-api-env }
          env:
            - name: PORT
              value: "4000"
          livenessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: 2000m, memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: stellariq-prod
spec:
  selector: { app: api }
  ports: [{ port: 80, targetPort: 4000 }]
---
# Scales to PRD 1151 load: 10k users / 1M swaps/day headroom.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: stellariq-prod
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
    - type: Pods
      pods: { metric: { name: http_requests_per_second }, target: { type: AverageValue, averageValue: 500 } }
